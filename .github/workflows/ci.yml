name: Cross-Platform CMake CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          echo "Linux setup"
          sudo apt-get install -y ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "macOS setup"
          brew install ccache

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Windows setup"
          choco install ccache

      - name: Setup Cache for ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt') }}-
            ${{ runner.os }}-ccache-

      - name: Configure CMake
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build application
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: build/Testing/Temporary/LastTest.log
          retention-days: 5

      - name: Upload build binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: |
            build/dataconv
            build/Release/dataconv.exe
            build/dataconv.exe
          if-no-files-found: warn